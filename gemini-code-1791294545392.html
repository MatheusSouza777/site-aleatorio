<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers & Snackeria Top</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- CABEÇALHO FIXO -->
    <header class="sticky top-0 z-40 bg-gray-900/95 backdrop-blur border-b border-gray-800 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-gray-900 p-2 rounded-xl font-black text-xl">
                    <i class="fa-solid font-bold fa-burger"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-amber-500">Burgers & Snackeria Top</h1>
                    <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ABERTO AGORA
                    </span>
                </div>
            </div>

            <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold px-4 py-2 rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hidden sm:inline">Carrinho</span>
                <span id="cart-badge-count" class="bg-gray-900 text-amber-500 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
                <span id="cart-badge-total" class="text-sm border-l border-gray-900/30 pl-2">R$ 0,00</span>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="bg-gradient-to-b from-gray-800 to-gray-900 py-8 px-4 text-center border-b border-gray-800">
        <div class="max-w-3xl mx-auto space-y-3">
            <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">
                🚀 Entrega rápida ~30 min | Frete Grátis acima de R$ 50,00
            </span>
            <h2 class="text-3xl sm:text-4xl font-black text-white">Os Melhores Burgers & Porções Gourmet</h2>
            <p class="text-gray-400 text-sm sm:text-base">Monte seu pedido online com rapidez e receba direto no seu WhatsApp!</p>
        </div>
    </section>

    <!-- CONTEÚDO PRINCIPAL (CARDÁPIO E BUSCA) -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Campo de Busca -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar hambúrguer, porção, bebida..." 
                class="w-full bg-gray-800 text-white pl-11 pr-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition">
        </div>

        <!-- Abas de Categorias -->
        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" id="category-tabs">
            <button onclick="setCategory('all')" class="cat-btn active bg-amber-500 text-gray-900 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Todos</button>
            <button onclick="setCategory('burgers')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Burgers Artesanais</button>
            <button onclick="setCategory('porcoes')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Porções & Coxinhas</button>
            <button onclick="setCategory('bebidas')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Bebidas & Sucos</button>
            <button onclick="setCategory('sobremesas')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Sobremesas</button>
            <button onclick="setCategory('combos')" class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap transition">Combos</button>
        </div>

        <!-- Grade de Produtos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Renderizado via JavaScript -->
        </div>
    </main>

    <!-- MODAL DE PERSONALIZAÇÃO -->
    <div id="product-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl border border-gray-700 flex flex-col max-h-[90vh]">
            <div class="relative h-48 bg-gray-900">
                <img id="modal-img" src="" class="w-full h-full object-cover">
                <button onclick="closeModal()" class="absolute top-3 right-3 bg-gray-900/80 text-white p-2 rounded-full hover:bg-gray-900">
                    <i class="fa-solid fa-xmark w-5 h-5 flex items-center justify-center"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4 flex-grow">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold text-white"></h3>
                    <p id="modal-desc" class="text-sm text-gray-400 mt-1"></p>
                    <span id="modal-base-price" class="text-amber-500 font-black text-lg block mt-2"></span>
                </div>

                <hr class="border-gray-700">

                <div>
                    <h4 class="font-bold text-sm text-gray-200 mb-2">Adicionais Pagos</h4>
                    <div class="space-y-2" id="modal-options">
                        <label class="flex items-center justify-between p-2 bg-gray-700/50 rounded-lg cursor-pointer hover:bg-gray-700">
                            <span class="text-sm"><input type="checkbox" data-price="4.00" data-name="Bacon Extra" class="option-check rounded accent-amber-500 mr-2"> Bacon Extra</span>
                            <span class="text-xs text-amber-400 font-bold">+ R$ 4,00</span>
                        </label>
                        <label class="flex items-center justify-between p-2 bg-gray-700/50 rounded-lg cursor-pointer hover:bg-gray-700">
                            <span class="text-sm"><input type="checkbox" data-price="4.00" data-name="Cheddar Cream" class="option-check rounded accent-amber-500 mr-2"> Cheddar Cream</span>
                            <span class="text-xs text-amber-400 font-bold">+ R$ 4,00</span>
                        </label>
                        <label class="flex items-center justify-between p-2 bg-gray-700/50 rounded-lg cursor-pointer hover:bg-gray-700">
                            <span class="text-sm"><input type="checkbox" data-price="8.00" data-name="Hambúrguer Extra (160g)" class="option-check rounded accent-amber-500 mr-2"> Hambúrguer Extra (160g)</span>
                            <span class="text-xs text-amber-400 font-bold">+ R$ 8,00</span>
                        </label>
                        <label class="flex items-center justify-between p-2 bg-gray-700/50 rounded-lg cursor-pointer hover:bg-gray-700">
                            <span class="text-sm"><input type="checkbox" data-price="3.00" data-name="Molho da Casa Extra" class="option-check rounded accent-amber-500 mr-2"> Molho da Casa Extra</span>
                            <span class="text-xs text-amber-400 font-bold">+ R$ 3,00</span>
                        </label>
                        <label class="flex items-center justify-between p-2 bg-gray-700/50 rounded-lg cursor-pointer hover:bg-gray-700">
                            <span class="text-sm"><input type="checkbox" data-price="3.00" data-name="Cebola Caramelizada" class="option-check rounded accent-amber-500 mr-2"> Cebola Caramelizada</span>
                            <span class="text-xs text-amber-400 font-bold">+ R$ 3,00</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-sm text-gray-200 block mb-1">Observações</label>
                    <textarea id="modal-obs" rows="2" placeholder="Ex: Sem salada, tirar cebola..." class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>
            </div>

            <div class="p-4 bg-gray-900 border-t border-gray-700 flex items-center justify-between gap-4">
                <div class="flex items-center border border-gray-700 rounded-lg bg-gray-800">
                    <button onclick="changeQty(-1)" class="px-3 py-1 text-gray-400 hover:text-white font-bold">-</button>
                    <span id="modal-qty" class="px-3 py-1 font-bold text-white">1</span>
                    <button onclick="changeQty(1)" class="px-3 py-1 text-gray-400 hover:text-white font-bold">+</button>
                </div>

                <button onclick="confirmAddToCart()" class="flex-grow bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold py-2.5 px-4 rounded-lg transition flex justify-between items-center">
